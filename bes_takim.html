
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#10131c">
<title>5 Takım Hediye Yarışı</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10131c;color:white;font-family:Arial,sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{text-align:center;padding:8px 4px;font-weight:bold}
h1{font-size:19px;margin:0 0 6px}
.info{color:#ffe082;font-size:clamp(12px,3.5vw,16px);margin-bottom:5px}
#status{font-size:12px;color:#fff;min-height:16px}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr 1fr;gap:5px;padding:4px}
.team{border:0;border-radius:13px;color:white;display:flex;flex-direction:column;align-items:center;justify-content:space-around;min-width:0;min-height:0;padding:5px 3px;font-weight:bold;touch-action:manipulation}
.team:active{filter:brightness(1.3)}
.fb{background:linear-gradient(145deg,#0751a4,#071b49,#d8b92b)}
.gs{background:linear-gradient(145deg,#c52531,#5a0a13,#d9ae2e)}
.bjk{background:linear-gradient(145deg,#454b53,#090a0c,#737b83)}
.ts{background:linear-gradient(145deg,#b52a38,#173f76,#b52a38)}
.amed{background:linear-gradient(145deg,#19884b,#07552e,#f1c940);grid-column:1 / span 2;width:50%;justify-self:center}
.name{font-size:clamp(11px,3.2vw,16px);text-align:center}
.crest{font-size:clamp(28px,8vw,46px)}
.hint{font-size:8px}
.count{font-size:clamp(32px,9.5vw,55px);line-height:1}
footer{display:flex;justify-content:center;gap:8px;padding:5px}
footer button{padding:9px 12px;border:0;border-radius:9px;font-weight:bold}
</style>
</head>
<body>
<header>
<h1>⚽ 5 TAKIM TIKLAMA YARIŞI</h1>
<div class="info">🎁 HER HEDİYE 1 PUAN</div>
<div class="info">🏆 EN ÇOK PUAN ALAN ŞAMPİYON!</div>
<div id="status">Takımına dokun, puanını artır!</div>
</header>

<main>
<button class="team fb" onclick="tikla('fb')">
<span class="name">FENERBAHÇE</span>
<span class="crest">🔵🟡</span>
<span class="hint">DOKUN VE PUAN KAZAN</span>
<span class="count" id="fb">0</span>
</button>

<button class="team gs" onclick="tikla('gs')">
<span class="name">GALATASARAY</span>
<span class="crest">🔴🟡</span>
<span class="hint">DOKUN VE PUAN KAZAN</span>
<span class="count" id="gs">0</span>
</button>

<button class="team bjk" onclick="tikla('bjk')">
<span class="name">BEŞİKTAŞ</span>
<span class="crest">⚫⚪</span>
<span class="hint">DOKUN VE PUAN KAZAN</span>
<span class="count" id="bjk">0</span>
</button>

<button class="team ts" onclick="tikla('ts')">
<span class="name">TRABZONSPOR</span>
<span class="crest">🍷💙</span>
<span class="hint">DOKUN VE PUAN KAZAN</span>
<span class="count" id="ts">0</span>
</button>

<button class="team amed" onclick="tikla('amed')">
<span class="name">AMEDSPOR</span>
<span class="crest">🟢🔴</span>
<span class="hint">DOKUN VE PUAN KAZAN</span>
<span class="count" id="amed">0</span>
</button>
</main>

<footer>
<button onclick="geri()">↩ Geri al</button>
<button onclick="sifirla()">⟲ Sıfırla</button>
</footer>

<script>
let skor={fb:0,gs:0,bjk:0,ts:0,amed:0};
let gecmis=[];
const isim={
fb:"Fenerbahçe",
gs:"Galatasaray",
bjk:"Beşiktaş",
ts:"Trabzonspor",
amed:"Amedspor"
};

function tikla(takim){
  skor[takim]++;
  gecmis.push(takim);
  goster();
}

function goster(){
  for(let takim in skor){
    document.getElementById(takim).textContent=skor[takim];
  }

  let enYuksek=Math.max(...Object.values(skor));
  let liderler=Object.keys(skor).filter(t=>skor[t]===enYuksek);
  let durum="Takımına dokun, puanını artır!";

  if(enYuksek>0 && liderler.length===1){
    durum="🏆 "+isim[liderler[0]]+" ŞAMPİYONLUKTA ÖNDE!";
  }else if(enYuksek>0){
    durum="🤝 BERABERE: "+liderler.map(t=>isim[t]).join(" • ");
  }

  document.getElementById("status").textContent=durum;
}

function geri(){
  let son=gecmis.pop();
  if(!son)return;
  skor[son]=Math.max(0,skor[son]-1);
  goster();
}

function sifirla(){
  if(!confirm("Tüm puanlar sıfırlansın mı?"))return;
  for(let takim in skor)skor[takim]=0;
  gecmis=[];
  goster();
}

goster();
</script>
</body>
</html>
