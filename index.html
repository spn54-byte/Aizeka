<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berat AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0b0f;
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 900px;
      margin: auto;
    }

    header {
      padding: 18px 20px;
      border-bottom: 1px solid #25252d;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #111116;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      font-size: 23px;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
    }

    .status {
      font-size: 12px;
      color: #4ade80;
      margin-top: 2px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 25px 18px 120px;
    }

    .welcome {
      text-align: center;
      margin-top: 18vh;
    }

    .welcome .big {
      font-size: 45px;
      margin-bottom: 12px;
    }

    .welcome h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .welcome p {
      color: #999;
      margin: 0;
    }

    .message {
      display: flex;
      margin: 14px 0;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 82%;
      padding: 13px 16px;
      border-radius: 18px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user .bubble {
      background: #2563eb;
      border-bottom-right-radius: 5px;
    }

    .ai .bubble {
      background: #1b1b22;
      border: 1px solid #292933;
      border-bottom-left-radius: 5px;
    }

    .input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 14px;
      background: linear-gradient(transparent, #0b0b0f 25%);
    }

    .input-box {
      max-width: 860px;
      margin: auto;
      display: flex;
      gap: 10px;
      background: #18181f;
      border: 1px solid #30303a;
      border-radius: 20px;
      padding: 8px;
    }

    textarea {
      flex: 1;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-size: 16px;
      padding: 11px;
      height: 45px;
      font-family: inherit;
    }

    textarea::placeholder {
      color: #777;
    }

    button {
      width: 45px;
      height: 45px;
      border: 0;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }

    .typing {
      color: #999;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">🤖</div>
    <div>
      <div class="title">Berat AI</div>
      <div class="status">● Çevrimiçi</div>
    </div>
  </header>

  <main id="messages">

    <div class="welcome" id="welcome">
      <div class="big">🤖</div>
      <h1>Merhaba, ben Berat AI</h1>
      <p>Size nasıl yardımcı olabilirim?</p>
    </div>

  </main>

  <div class="input-area">
    <div class="input-box">
      <textarea
        id="input"
        placeholder="Berat AI'a bir şey sor..."
        autocomplete="off"></textarea>

      <button id="send">➤</button>
    </div>
  </div>

</div>

<script>

const API_URL = "https://berat-ai-api.spn-54.workers.dev";

const input = document.getElementById("input");
const send = document.getElementById("send");
const messages = document.getElementById("messages");
const welcome = document.getElementById("welcome");

function addMessage(text, type) {

  if (welcome) {
    welcome.remove();
  }

  const row = document.createElement("div");
  row.className = "message " + type;

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  row.appendChild(bubble);
  messages.appendChild(row);

  messages.scrollTop = messages.scrollHeight;

  return bubble;
}

async function sendMessage() {

  const text = input.value.trim();

  if (!text || send.disabled) {
    return;
  }

  input.value = "";

  addMessage(text, "user");

  send.disabled = true;

  const aiBubble = addMessage("Berat AI düşünüyor...", "ai");

  try {

    const response = await fetch(API_URL, {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        prompt: text
      })
    });

    const data = await response.json();

    if (data.success) {
      aiBubble.textContent = data.response;
    } else {
      aiBubble.textContent =
        "Bir hata oluştu: " + (data.error || "Bilinmeyen hata");
    }

  } catch (error) {

    aiBubble.textContent =
      "Sunucuya bağlanamadım. Lütfen tekrar dene.";

  } finally {

    send.disabled = false;
    input.focus();

  }
}

send.addEventListener("click", sendMessage);

input.addEventListener("keydown", function(event) {

  if (event.key === "Enter" && !event.shiftKey) {

    event.preventDefault();
    sendMessage();

  }

});

</script>

</body>
</html>
