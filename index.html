<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Berat AI</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#0b0f19;
  color:white;
}

.container{
  max-width:700px;
  margin:auto;
  min-height:100vh;
  padding:20px;
  display:flex;
  flex-direction:column;
}

header{
  text-align:center;
  padding:25px 0;
}

.logo{
  width:60px;
  height:60px;
  margin:auto;
  border-radius:50%;
  background:linear-gradient(135deg,#7c5cff,#00c6ff);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:bold;
}

h1{
  margin:12px 0 5px;
  font-size:28px;
}

.subtitle{
  color:#9ca3af;
}

#chat{
  flex:1;
  overflow-y:auto;
  padding:15px 0;
}

.message{
  padding:14px 16px;
  margin:10px 0;
  border-radius:18px;
  max-width:85%;
  line-height:1.5;
  white-space:pre-wrap;
}

.user{
  background:#3157d5;
  margin-left:auto;
}

.ai{
  background:#171d2b;
  border:1px solid #293144;
  margin-right:auto;
}

.preview{
  max-width:100%;
  max-height:300px;
  border-radius:15px;
  margin-top:10px;
}

.input-area{
  background:#151b28;
  border:1px solid #30384c;
  border-radius:22px;
  padding:10px;
}

textarea{
  width:100%;
  min-height:60px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  font-size:16px;
  padding:10px;
}

.buttons{
  display:flex;
  align-items:center;
  gap:10px;
}

button,
.file-label{
  border:0;
  border-radius:14px;
  padding:12px 16px;
  color:white;
  background:#252d3d;
  font-size:15px;
  cursor:pointer;
}

button.send{
  margin-left:auto;
  background:#5b4df5;
  font-weight:bold;
}

.file-label{
  display:inline-block;
}

input[type=file]{
  display:none;
}

.status{
  text-align:center;
  color:#7f8aa3;
  font-size:12px;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<header>
  <div class="logo">B</div>
  <h1>Berat AI</h1>
  <div class="subtitle">Senin yapay zekâ asistanın</div>
</header>

<div id="chat">

  <div class="message ai">
    👋 Selam! Ben Berat AI.<br><br>
    Bana mesaj yazabilir veya fotoğraf yükleyebilirsin.
  </div>

</div>

<div class="input-area">

  <textarea id="message"
    placeholder="Berat AI'ya bir şey sor..."></textarea>

  <div class="buttons">

    <label class="file-label">
      📷 Fotoğraf
      <input
        type="file"
        id="photo"
        accept="image/*">
    </label>

    <button class="send" onclick="sendMessage()">
      Gönder ➤
    </button>

  </div>

</div>

<div class="status">
  Berat AI • Beta
</div>

</div>

<script>

let selectedImage = null;

const photoInput = document.getElementById("photo");
const messageInput = document.getElementById("message");
const chat = document.getElementById("chat");

photoInput.addEventListener("change", function(){

  const file = this.files[0];

  if(!file) return;

  selectedImage = file;

  const reader = new FileReader();

  reader.onload = function(e){

    const msg = document.createElement("div");
    msg.className = "message user";

    msg.innerHTML = `
      📷 Fotoğraf seçildi
      <br>
      <img class="preview" src="${e.target.result}">
    `;

    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;

  };

  reader.readAsDataURL(file);

});

function sendMessage(){

  const text = messageInput.value.trim();

  if(!text && !selectedImage){
    return;
  }

  if(text){

    const userMsg = document.createElement("div");
    userMsg.className = "message user";
    userMsg.textContent = text;

    chat.appendChild(userMsg);

    messageInput.value = "";

    chat.scrollTop = chat.scrollHeight;

    setTimeout(() => {

      const aiMsg = document.createElement("div");
      aiMsg.className = "message ai";

      aiMsg.textContent =
        "Mesajını aldım. 🤖 Gerçek yapay zekâ bağlantısını eklediğimizde sana burada cevap vereceğim.";

      chat.appendChild(aiMsg);

      chat.scrollTop = chat.scrollHeight;

    },700);

  }

}

messageInput.addEventListener("keydown", function(e){

  if(e.key === "Enter" && !e.shiftKey){

    e.preventDefault();
    sendMessage();

  }

});

</script>

</body>
</html>
