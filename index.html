<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Berat AI</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#090c15;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.app{
  width:100%;
  max-width:800px;
  min-height:100vh;
  margin:auto;
  display:flex;
  flex-direction:column;
}

header{
  text-align:center;
  padding:38px 20px 20px;
}

.logo{
  width:64px;
  height:64px;
  margin:auto;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:800;
  background:linear-gradient(135deg,#4d5cff,#733cff);
  box-shadow:0 0 35px rgba(78,88,255,.35);
}

h1{
  margin:14px 0 5px;
  font-size:34px;
}

.subtitle{
  color:#9299aa;
  font-size:18px;
}

.chat{
  flex:1;
  padding:15px 16px 150px;
}

.message{
  max-width:86%;
  padding:17px 19px;
  margin:13px 0;
  border-radius:24px;
  font-size:17px;
  line-height:1.55;
  white-space:pre-wrap;
}

.ai{
  background:#171c2a;
  border:1px solid #293248;
  margin-right:auto;
}

.user{
  background:linear-gradient(135deg,#4056d8,#5940e8);
  margin-left:auto;
  border-bottom-right-radius:7px;
}

.ai{
  border-bottom-left-radius:7px;
}

.composer{
  position:fixed;
  left:50%;
  bottom:15px;
  transform:translateX(-50%);
  width:calc(100% - 24px);
  max-width:776px;
  background:rgba(20,24,37,.96);
  border:1px solid #30384d;
  border-radius:27px;
  padding:12px;
  backdrop-filter:blur(18px);
  box-shadow:0 10px 40px rgba(0,0,0,.35);
}

.row{
  display:flex;
  align-items:flex-end;
  gap:9px;
}

textarea{
  flex:1;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  font-size:17px;
  padding:12px 8px;
  min-height:48px;
  max-height:130px;
  font-family:inherit;
}

textarea::placeholder{
  color:#747c90;
}

button{
  border:0;
  cursor:pointer;
  color:white;
  font-family:inherit;
}

.photo{
  width:48px;
  height:48px;
  border-radius:16px;
  background:#272d3e;
  font-size:22px;
}

.send{
  width:100px;
  height:48px;
  border-radius:16px;
  background:linear-gradient(135deg,#465be0,#6044ec);
  font-size:16px;
  font-weight:700;
}

.send:active,
.photo:active{
  transform:scale(.96);
}

.preview{
  display:none;
  margin:5px 5px 12px;
  position:relative;
}

.preview img{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:15px;
  border:1px solid #3a435a;
}

.remove{
  position:absolute;
  top:-7px;
  left:78px;
  width:24px;
  height:24px;
  border-radius:50%;
  background:#e5455b;
  font-weight:bold;
}

.typing{
  display:none;
  color:#858da0;
  font-size:14px;
  padding:0 20px 10px;
}

.footer{
  text-align:center;
  color:#4e5669;
  font-size:12px;
  padding:0 0 120px;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">B</div>
  <h1>Berat AI</h1>
  <div class="subtitle">Senin yapay zekâ asistanın</div>
</header>

<main class="chat" id="chat">

  <div class="message ai">
👋 Selam! Ben Berat AI.

Bana mesaj yazabilir veya fotoğraf gönderebilirsin.

Hazırım reis 😎
  </div>

</main>

<div class="typing" id="typing">
  Berat AI yazıyor...
</div>

<div class="composer">

  <div class="preview" id="preview">
    <img id="previewImage">
    <button class="remove" onclick="removePhoto()">×</button>
  </div>

  <div class="row">

    <button class="photo" onclick="document.getElementById('photoInput').click()">
      📷
    </button>

    <textarea
      id="message"
      placeholder="Berat AI'ya bir şey sor..."
      rows="1"
      oninput="autoResize(this)"
    ></textarea>

    <button class="send" onclick="sendMessage()">
      Gönder ➤
    </button>

  </div>

</div>

<input
  id="photoInput"
  type="file"
  accept="image/*"
  hidden
  onchange="selectPhoto(event)"
>

</div>

<script>

let selectedPhoto = null;

const chat = document.getElementById("chat");
const message = document.getElementById("message");
const typing = document.getElementById("typing");

function addMessage(text,type){

  const div = document.createElement("div");

  div.className = "message " + type;
  div.textContent = text;

  chat.appendChild(div);

  window.scrollTo({
    top:document.body.scrollHeight,
    behavior:"smooth"
  });
}

function sendMessage(){

  const text = message.value.trim();

  if(!text && !selectedPhoto){
    return;
  }

  if(selectedPhoto){

    const photoMessage = document.createElement("div");
    photoMessage.className = "message user";

    const img = document.createElement("img");
    img.src = selectedPhoto;
    img.style.width = "100%";
    img.style.maxWidth = "260px";
    img.style.borderRadius = "16px";

    photoMessage.appendChild(img);

    if(text){
      const caption = document.createElement("div");
      caption.style.marginTop = "10px";
      caption.textContent = text;
      photoMessage.appendChild(caption);
    }

    chat.appendChild(photoMessage);

    removePhoto();

  }else{

    addMessage(text,"user");

  }

  message.value = "";
  message.style.height = "auto";

  showTyping();

  setTimeout(function(){

    hideTyping();

    let answer =
      "Mesajını aldım reis. 🤖\n\n" +
      "Gerçek yapay zekâ bağlantısını birazdan ekleyeceğiz. " +
      "Şu anda arayüz ve mesaj sistemi çalışıyor.";

    if(text && text.toLowerCase().includes("merhaba")){
      answer = "Merhaba reis 😎 Nasılsın?";
    }

    if(text && text.toLowerCase().includes("nasılsın")){
      answer = "İyiyim reis 😄 Sen nasılsın?";
    }

    addMessage(answer,"ai");

  },700);

}

function showTyping(){
  typing.style.display="block";
  window.scrollTo({
    top:document.body.scrollHeight,
    behavior:"smooth"
  });
}

function hideTyping(){
  typing.style.display="none";
}

function autoResize(el){

  el.style.height="auto";
  el.style.height=Math.min(el.scrollHeight,130)+"px";

}

function selectPhoto(event){

  const file = event.target.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload=function(e){

    selectedPhoto=e.target.result;

    document.getElementById("previewImage").src=selectedPhoto;
    document.getElementById("preview").style.display="block";

  };

  reader.readAsDataURL(file);

}

function removePhoto(){

  selectedPhoto=null;

  document.getElementById("preview").style.display="none";
  document.getElementById("previewImage").src="";
  document.getElementById("photoInput").value="";

}

message.addEventListener("keydown",function(e){

  if(e.key==="Enter" && !e.shiftKey){

    e.preventDefault();
    sendMessage();

  }

});

</script>

</body>
</html>
