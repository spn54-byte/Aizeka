<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Berat AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0b0b0f;
  color:white;
  font-family:Arial,sans-serif;
  height:100vh;
  display:flex;
  flex-direction:column;
}

header{
  height:80px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  border-bottom:1px solid #29292f;
  background:#0b0b0f;
}

.logo{
  font-size:30px;
  font-weight:bold;
  color:#6657ff;
}

.newchat{
  background:#1d1d24;
  color:white;
  border:1px solid #383842;
  border-radius:12px;
  padding:10px 14px;
  font-size:14px;
}

#chat{
  flex:1;
  overflow-y:auto;
  padding:25px 18px 120px;
}

.message{
  max-width:760px;
  margin:0 auto 18px;
  padding:18px 20px;
  border-radius:20px;
  line-height:1.6;
  font-size:17px;
  white-space:pre-wrap;
}

.user{
  background:#635bff;
}

.ai{
  background:#1c1c23;
}

.copy{
  margin-top:10px;
  background:transparent;
  border:1px solid #444;
  color:#aaa;
  border-radius:8px;
  padding:5px 9px;
  font-size:12px;
}

.welcome{
  text-align:center;
  margin-top:100px;
}

.welcome h1{
  font-size:38px;
  margin-bottom:10px;
}

.welcome p{
  color:#aaa;
}

.input-area{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  padding:15px;
  background:rgba(11,11,15,.96);
  border-top:1px solid #29292f;
}

.input-box{
  max-width:900px;
  margin:auto;
  display:flex;
  gap:10px;
}

#prompt{
  flex:1;
  background:#19191f;
  color:white;
  border:1px solid #393943;
  border-radius:18px;
  padding:16px;
  font-size:16px;
  outline:none;
}

#send{
  background:#635bff;
  color:white;
  border:0;
  border-radius:18px;
  padding:0 24px;
  font-size:16px;
  font-weight:bold;
}

#send:disabled{
  opacity:.5;
}

@media(max-width:600px){
  .logo{font-size:27px}
  .message{font-size:16px}
  #send{padding:0 18px}
}
</style>
</head>

<body>

<header>
  <div class="logo">🤖 Berat AI</div>
  <button class="newchat" onclick="newChat()">＋ Yeni Sohbet</button>
</header>

<div id="chat">

  <div class="welcome" id="welcome">
    <h1>Berat AI</h1>
    <p>Merhaba 👋 Sana nasıl yardımcı olabilirim?</p>
  </div>

</div>

<div class="input-area">
  <div class="input-box">

    <input
      id="prompt"
      type="text"
      placeholder="Berat AI'ya bir şey sor..."
      autocomplete="off"
    >

    <button id="send">Gönder</button>

  </div>
</div>

<script>

const API_URL =
"https://berat-ai-api.spn-54.workers.dev";

const chat = document.getElementById("chat");
const input = document.getElementById("prompt");
const send = document.getElementById("send");

let history = [];

function addMessage(text,type){

  const box = document.createElement("div");
  box.className = "message " + type;

  const content = document.createElement("div");
  content.textContent = text;

  box.appendChild(content);

  if(type === "ai"){

    const copy = document.createElement("button");

    copy.className = "copy";
    copy.textContent = "Kopyala";

    copy.onclick = async () => {

      await navigator.clipboard.writeText(text);

      copy.textContent = "Kopyalandı ✓";

      setTimeout(()=>{
        copy.textContent = "Kopyala";
      },1500);

    };

    box.appendChild(copy);
  }

  chat.appendChild(box);

  chat.scrollTop = chat.scrollHeight;

  return box;
}

async function sendMessage(){

  const text = input.value.trim();

  if(!text) return;

  const welcome = document.getElementById("welcome");

  if(welcome) welcome.remove();

  addMessage(text,"user");

  input.value="";
  input.disabled=true;
  send.disabled=true;

  const loading = addMessage(
    "Berat AI düşünüyor... 🤖",
    "ai"
  );

  try{

    /*
      Konuşma geçmişini prompt içine ekliyoruz.
      Böylece Worker değişmeden konuşmanın
      bağlamını koruyabiliyoruz.
    */

    history.push({
      role:"user",
      content:text
    });

    const conversation = history
      .map(x => {
        return (x.role === "user" ? "Kullanıcı: " : "Berat AI: ")
          + x.content;
      })
      .join("\n\n");

    const response = await fetch(API_URL,{
      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        prompt:
`Sen Berat AI'sın.
Kullanıcıyla Türkçe konuş.
Önceki konuşmayı dikkate al.
Samimi, anlaşılır ve yardımcı ol.

KONUŞMA:
${conversation}

Şimdi kullanıcının son mesajına cevap ver.`
      })
    });

    const data = await response.json();

    loading.remove();

    if(!response.ok){

      addMessage(
        "Hata: " +
        (data.error || "Sunucu hatası"),
        "ai"
      );

      return;
    }

    const answer =
      data.response ||
      "Cevap alınamadı.";

    addMessage(answer,"ai");

    history.push({
      role:"assistant",
      content:answer
    });

  }catch(error){

    loading.remove();

    addMessage(
      "Bağlantı hatası oluştu. 🤖",
      "ai"
    );

    console.error(error);

  }finally{

    input.disabled=false;
    send.disabled=false;
    input.focus();

  }
}

function newChat(){

  history=[];

  chat.innerHTML=`
    <div class="welcome" id="welcome">
      <h1>Berat AI</h1>
      <p>Merhaba 👋 Sana nasıl yardımcı olabilirim?</p>
    </div>
  `;

  input.value="";
  input.focus();
}

send.onclick=sendMessage;

input.addEventListener("keydown",(e)=>{

  if(e.key==="Enter"){
    sendMessage();
  }

});

</script>

</body>
</html>
