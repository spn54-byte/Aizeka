<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berat AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 1px solid #292929;
      background: #111116;
    }

    header span {
      color: #00d084;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 85%;
      padding: 13px 16px;
      border-radius: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user {
      align-self: flex-end;
      background: #2563eb;
    }

    .ai {
      align-self: flex-start;
      background: #202027;
    }

    .welcome {
      margin: auto;
      text-align: center;
      color: #aaa;
    }

    .welcome h1 {
      color: white;
      font-size: 32px;
      margin-bottom: 8px;
    }

    .input-area {
      padding: 12px;
      background: #111116;
      border-top: 1px solid #292929;
      display: flex;
      gap: 8px;
    }

    #prompt {
      flex: 1;
      padding: 14px;
      border: 1px solid #333;
      border-radius: 14px;
      outline: none;
      background: #1b1b22;
      color: white;
      font-size: 16px;
    }

    #send {
      border: none;
      border-radius: 14px;
      padding: 0 20px;
      background: #00d084;
      color: black;
      font-weight: bold;
      font-size: 16px;
    }

    #send:disabled {
      opacity: .5;
    }
  </style>
</head>

<body>

  <header>
    🤖 <span>Berat AI</span>
  </header>

  <div id="chat">
    <div class="welcome" id="welcome">
      <h1>Berat AI</h1>
      <p>Merhaba 👋 Sana nasıl yardımcı olabilirim?</p>
    </div>
  </div>

  <div class="input-area">
    <input
      id="prompt"
      type="text"
      placeholder="Berat AI'ya bir şey sor..."
      autocomplete="off"
    >
    <button id="send">Gönder</button>
  </div>

  <script>
    const API_URL = "https://berat-ai-api.spn-54.workers.dev";

    const chat = document.getElementById("chat");
    const promptInput = document.getElementById("prompt");
    const sendButton = document.getElementById("send");
    const welcome = document.getElementById("welcome");

    function addMessage(text, type) {
      if (welcome) {
        welcome.remove();
      }

      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;

      return div;
    }

    async function sendMessage() {
      const prompt = promptInput.value.trim();

      if (!prompt) return;

      addMessage(prompt, "user");

      promptInput.value = "";
      sendButton.disabled = true;
      promptInput.disabled = true;

      const loading = addMessage("Berat AI düşünüyor... 🤖", "ai");

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            prompt: prompt
          })
        });

        const data = await response.json();

        loading.remove();

        if (!response.ok) {
          addMessage(
            "Bir hata oluştu: " + (data.error || "Sunucu hatası"),
            "ai"
          );
          return;
        }

        addMessage(
          data.response || "Cevap alınamadı.",
          "ai"
        );

      } catch (error) {
        loading.remove();

        addMessage(
          "Bağlantı hatası oluştu. API adresini kontrol et.",
          "ai"
        );

        console.error(error);
      }

      sendButton.disabled = false;
      promptInput.disabled = false;
      promptInput.focus();
    }

    sendButton.addEventListener("click", sendMessage);

    promptInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
