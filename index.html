<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berat AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b0f;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px 22px;
      border-bottom: 1px solid #25252d;
      font-size: 28px;
      font-weight: 800;
      color: #7167ff;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px 140px;
    }

    .message {
      max-width: 88%;
      padding: 16px 18px;
      margin: 12px 0;
      border-radius: 20px;
      white-space: pre-wrap;
      line-height: 1.55;
      font-size: 17px;
    }

    .user {
      margin-left: auto;
      background: #665cff;
    }

    .ai {
      margin-right: auto;
      background: #1b1b22;
    }

    .loading {
      opacity: .6;
    }

    .bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 14px;
      background: #0b0b0f;
      border-top: 1px solid #25252d;
      display: flex;
      gap: 10px;
    }

    textarea {
      flex: 1;
      resize: none;
      height: 58px;
      border: 1px solid #35353f;
      border-radius: 18px;
      background: #18181f;
      color: white;
      padding: 16px;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 105px;
      border: 0;
      border-radius: 18px;
      background: #665cff;
      color: white;
      font-size: 17px;
      font-weight: 700;
    }

    button:disabled {
      opacity: .5;
    }
  </style>
</head>

<body>

<div class="app">

  <header>🤖 Berat AI</header>

  <main class="chat" id="chat">

    <div class="message ai">
      Merhaba! 👋 Ben Berat AI.
      Sana nasıl yardımcı olabilirim?
    </div>

  </main>

  <div class="bottom">

    <textarea
      id="input"
      placeholder="Berat AI'ya bir şey sor..."
      rows="1"></textarea>

    <button id="send">Gönder</button>

  </div>

</div>

<script>

const API_URL =
  "https://berat-ai-api.spn-54.workers.dev";

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const send = document.getElementById("send");


function addMessage(text, type) {

  const div = document.createElement("div");

  div.className = "message " + type;

  div.textContent = text;

  chat.appendChild(div);

  chat.scrollTop = chat.scrollHeight;

  return div;
}


async function sendMessage() {

  const message = input.value.trim();

  if (!message) return;

  addMessage(message, "user");

  input.value = "";

  send.disabled = true;

  const loading = addMessage(
    "Berat AI düşünüyor... 🤖",
    "ai loading"
  );


  try {

    const response = await fetch(API_URL, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: message,
        prompt: message,
        input: message
      })

    });


    if (!response.ok) {

      throw new Error(
        "Sunucu hatası: " + response.status
      );

    }


    const data = await response.json();


    const answer =
      data.response ||
      data.result ||
      data.text ||
      data.output ||
      data.answer ||
      data.message;


    loading.remove();


    if (answer) {

      addMessage(answer, "ai");

    } else {

      addMessage(
        "Sunucudan cevap geldi fakat cevap formatı anlaşılmadı.",
        "ai"
      );

      console.log("API CEVABI:", data);

    }

  }

  catch (error) {

    loading.remove();

    addMessage(
      "Bağlantı hatası ❌\n\n" +
      error.message,
      "ai"
    );

    console.error(error);

  }

  finally {

    send.disabled = false;

    input.focus();

  }

}


send.addEventListener(
  "click",
  sendMessage
);


input.addEventListener(
  "keydown",
  function(e) {

    if (e.key === "Enter" && !e.shiftKey) {

      e.preventDefault();

      sendMessage();

    }

  }
);

</script>

</body>
</html>
