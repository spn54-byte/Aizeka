<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Berat AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #0b0b0f;
  color: white;
  height: 100vh;
}

.app {
  height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  padding: 18px 20px;
  border-bottom: 1px solid #29292f;
  font-size: 22px;
  font-weight: 700;
}

header span {
  color: #6c63ff;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.message {
  max-width: 85%;
  padding: 13px 16px;
  margin-bottom: 14px;
  border-radius: 16px;
  line-height: 1.5;
  white-space: pre-wrap;
}

.user {
  background: #6c63ff;
  margin-left: auto;
}

.ai {
  background: #1b1b22;
  margin-right: auto;
}

.bottom {
  padding: 12px;
  border-top: 1px solid #29292f;
  display: flex;
  gap: 8px;
  background: #0b0b0f;
}

input {
  flex: 1;
  padding: 14px;
  border-radius: 14px;
  border: 1px solid #33333b;
  background: #18181f;
  color: white;
  font-size: 16px;
  outline: none;
}

button {
  border: 0;
  border-radius: 14px;
  padding: 0 20px;
  background: #6c63ff;
  color: white;
  font-size: 16px;
  font-weight: 600;
}

button:disabled {
  opacity: .5;
}
</style>
</head>

<body>

<div class="app">

<header>
  🤖 <span>Berat AI</span>
</header>

<div id="chat">
  <div class="message ai">
    Merhaba! Ben Berat AI 🤖<br>
    Sana nasıl yardımcı olabilirim?
  </div>
</div>

<div class="bottom">
  <input id="input" placeholder="Berat AI'ya bir şey sor..." />
  <button id="send">Gönder</button>
</div>

</div>

<script>

const API_URL = "https://berat-ai-api.spn-54.workers.dev";

const input = document.getElementById("input");
const send = document.getElementById("send");
const chat = document.getElementById("chat");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function sendMessage() {

  const prompt = input.value.trim();

  if (!prompt) return;

  addMessage(prompt, "user");

  input.value = "";
  send.disabled = true;

  const loading = addMessage("Düşünüyorum... 🤔", "ai");

  try {

    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        prompt: prompt
      })
    });

    const data = await response.json();

    loading.remove();

    if (!response.ok) {
      throw new Error(data.error || "API hatası");
    }

    const answer =
      data.response ||
      data.result ||
      data.text ||
      data.output ||
      "Cevap alınamadı.";

    addMessage(answer, "ai");

  } catch (error) {

    loading.remove();

    addMessage(
      "Üzgünüm, şu anda bağlantıda bir sorun oluştu. 😕\n\n" +
      error.message,
      "ai"
    );

  } finally {
    send.disabled = false;
    input.focus();
  }
}

send.addEventListener("click", sendMessage);

input.addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    sendMessage();
  }
});

</script>

</body>
</html>
