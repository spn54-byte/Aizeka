
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FB - GS Tıklama Yarışı</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:white;font-family:Arial;height:100dvh;display:flex;flex-direction:column}
header{text-align:center;padding:12px;font-weight:bold}
main{display:flex;flex:1;min-height:0;gap:5px;padding:5px}
.team{width:50%;border:0;border-radius:15px;color:white;font-weight:bold;display:flex;flex-direction:column;align-items:center;justify-content:space-around;font-size:20px;touch-action:manipulation}
.fb{background:linear-gradient(#0751a4,#071b49,#e5c32c)}
.gs{background:linear-gradient(#c91f32,#600916,#e5b52c)}
.count{font-size:clamp(60px,18vw,100px)}
.crest{font-size:clamp(65px,20vw,100px)}
button:active{filter:brightness(1.3)}
footer{display:flex;justify-content:center;gap:10px;padding:10px}
footer button{padding:12px;border:0;border-radius:9px;font-weight:bold}
</style>
</head>
<body>
<header>⚽ TIKLAMA YARIŞI<br>
<span id="status">Fenerbahçe 0 - 0 Galatasaray</span>
</header>
<main>
<button class="team fb" onclick="tikla('fb')">
<span>FENERBAHÇE</span>
<span class="crest">🔵🟡</span>
<span>DOKUN!</span>
<span class="count" id="fb">0</span>
</button>
<button class="team gs" onclick="tikla('gs')">
<span>GALATASARAY</span>
<span class="crest">🔴🟡</span>
<span>DOKUN!</span>
<span class="count" id="gs">0</span>
</button>
</main>
<footer>
<button onclick="geri()">↩ Geri al</button>
<button onclick="sifirla()">⟲ Sıfırla</button>
</footer>
<script>
let fb=0,gs=0,gecmis=[];
function tikla(t){
gecmis.push(t);
if(t==='fb')fb++;else gs++;
goster();
}
function goster(){
document.getElementById('fb').textContent=fb;
document.getElementById('gs').textContent=gs;
let s=fb===gs?'Berabere!':fb>gs?'Fenerbahçe önde!':'Galatasaray önde!';
document.getElementById('status').textContent=
'FB '+fb+' - '+gs+' GS | '+s;
}
function geri(){
let t=gecmis.pop();
if(t==='fb')fb=Math.max(0,fb-1);
if(t==='gs')gs=Math.max(0,gs-1);
goster();
}
function sifirla(){
fb=0;gs=0;gecmis=[];goster();
}
</script>
</body>
</html>
